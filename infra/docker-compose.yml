services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mosaic_catalog
    ports:
      - "5432:5432"
    volumes:
      - mosaic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosaic_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mosaic_pgdata:
