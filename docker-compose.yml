services:
  postgres:
    build:
      context: .
      dockerfile: infra/local-postgres/Dockerfile
      args:
        POSTGRES_IMAGE_VERSION: "18.3"
        POSTGRES_MAJOR: "18"
        PGVECTOR_VERSION: "v0.8.2"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: retrieval
      POSTGRES_USER: retrieval
      POSTGRES_PASSWORD: retrieval
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval -d retrieval"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
