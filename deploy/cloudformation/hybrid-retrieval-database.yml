AWSTemplateFormatVersion: '2010-09-09'
Description: 'Mosaic workshop - fresh encrypted Aurora PostgreSQL 18.3 cluster'

Parameters:
  TemplateName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,40}$'

  InfrastructureRevision:
    Type: String
    AllowedPattern: '^[0-9a-f]{16}$'

  VPC:
    Type: AWS::EC2::VPC::Id

  VpcCIDR:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  DatabaseClientSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  PrivateSubnets:
    Type: String
    Description: Comma-separated private subnet IDs

  DBInstanceClass:
    Type: String
    Default: db.r8g.2xlarge
    AllowedValues:
      - db.r8g.xlarge
      - db.r8g.2xlarge
      - db.r8g.4xlarge

Resources:
  EncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub '${AWS::StackName} Aurora and Database Insights encryption key'
      EnableKeyRotation: true
      # The shortest window KMS allows. Nothing outlives the stack that this
      # key could still decrypt, so the default 30-day tail only bills.
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: RDSKeyUse
            Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action:
              - kms:CreateGrant
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub 'rds.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName

  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-aurora'
      TargetKeyId: !Ref EncryptionKey

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Mosaic Aurora private subnets
      SubnetIds: !Split [',', !Ref PrivateSubnets]
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName

  DBClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Mosaic Aurora PostgreSQL 18 cluster parameters
      Family: aurora-postgresql18
      Parameters:
        rds.force_ssl: '1'
        shared_preload_libraries: pg_stat_statements
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Mosaic Aurora PostgreSQL 18 instance parameters
      Family: aurora-postgresql18
      Parameters:
        # pgvector builds the HNSW graph in maintenance_work_mem and falls back
        # to a much slower on-disk phase when the graph exceeds it. The
        # 500k x 1024-dim build needs roughly 3 GiB; Aurora's default formula
        # yields about 1 GB on db.r8g.2xlarge. 1/8 of instance memory (in KB)
        # keeps the build in memory on every allowed instance class while
        # leaving Aurora's ~75% shared_buffers untouched.
        maintenance_work_mem: GREATEST({DBInstanceClassMemory/8192},65536)
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mosaic Aurora access from the application host
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: PostgreSQL from the Mosaic application host
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref DatabaseClientSecurityGroupId
      SecurityGroupEgress:
        - Description: Return traffic within the VPC
          IpProtocol: -1
          CidrIp: !Ref VpcCIDR
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName

  DBMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole'

  DBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '18.3'
      # Standard mode is the free tier that replaced the Performance Insights
      # console; the writer keeps the 7-day retention and the stack's key.
      DatabaseInsightsMode: standard
      DatabaseName: mosaic_catalog
      MasterUsername: mosaic_admin
      ManageMasterUserPassword: true
      StorageEncrypted: true
      KmsKeyId: !GetAtt EncryptionKey.Arn
      EnableIAMDatabaseAuthentication: true
      Port: 5432
      DBClusterParameterGroupName: !Ref DBClusterParameterGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      StorageType: aurora-iopt1
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName
        - Key: Dataset
          Value: mosaic-catalog-500k-cohere-v4
        - Key: InfrastructureRevision
          Value: !Ref InfrastructureRevision

  DBInstanceWriter:
    Type: AWS::RDS::DBInstance
    # Explicit for the same reason the cluster's policy is: a disposable
    # workshop cluster must not leave a snapshot or an orphan behind.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: !Ref DBInstanceClass
      Engine: aurora-postgresql
      DBParameterGroupName: !Ref DBParameterGroup
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DBMonitoringRole.Arn
      PubliclyAccessible: false
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: 7
      PerformanceInsightsKMSKeyId: !Ref EncryptionKey
      AutoMinorVersionUpgrade: false
      PromotionTier: 0
      Tags:
        - Key: Workshop
          Value: !Ref TemplateName
        - Key: Role
          Value: writer

Outputs:
  DBSecretArn:
    Description: RDS-managed master secret created for this cluster
    Value: !GetAtt DBCluster.MasterUserSecret.SecretArn

  DBClusterIdentifier:
    Description: Aurora cluster identifier
    Value: !Ref DBCluster

  DBClusterEndpoint:
    Description: Aurora writer endpoint
    Value: !GetAtt DBCluster.Endpoint.Address

  DBClusterPort:
    Description: Aurora port
    Value: !GetAtt DBCluster.Endpoint.Port

  DBEngineVersion:
    Description: Aurora PostgreSQL version for Mosaic
    Value: '18.3'

  EncryptionKeyArn:
    Description: Account-local KMS key used by Aurora and Database Insights
    Value: !GetAtt EncryptionKey.Arn
