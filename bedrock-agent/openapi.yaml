openapi: 3.0.0
info:
  title: Agentic Hybrid Retrieval Tools
  version: 0.1.0
paths:
  /searchEvidence:
    post:
      operationId: searchEvidence
      description: Search operational evidence across conversations, tickets, docs, customer cases, and code records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                sourceSystems:
                  type: array
                  items:
                    type: string
                projectKey:
                  type: string
                limit:
                  type: integer
                  default: 8
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
  /answerQuestion:
    post:
      operationId: answerQuestion
      description: Decompose an operational question, retrieve evidence, and synthesize a cited answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                limit:
                  type: integer
                  default: 8
      responses:
        '200':
          description: Cited answer
          content:
            application/json:
              schema:
                type: object
