[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-retrieval-mcp"
version = "0.2.0"
description = "Mosaic MCP 2026-07-28 adapter for the hybrid retrieval API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
]

[project.scripts]
mosaic-retrieval-mcp = "catalog_mcp.server:main"

[tool.setuptools.packages.find]
include = ["catalog_mcp*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["mcp_tests"]
python_files = ["contract_cases.py"]
