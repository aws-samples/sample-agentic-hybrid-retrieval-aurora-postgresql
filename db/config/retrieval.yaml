# The single source for retrieval numbers.
#
# Read by scripts/retrieval_profile.py, which supplies defaults to
# service/config.py and service/models.py. Environment variables override these
# values; nothing else may declare them. scripts/config_tripwire.py fails the
# build if another file does.
#
# Editing a number here changes the served profile with no code edit. That is
# the point: before Phase 2 Unit C this file was documentation, three live
# copies of these numbers agreed by luck, and a fourth (config/workshop.json)
# disagreed with all of them. See docs/rewrite-losses.md LOSS-3.
version: 2
embedding:
  dimensions: 1024
  distance_metric: cosine
  product_field: mosaic_search.product_document.embedding
  evidence_field: product specifications reuse product_document.embedding; source-specific evidence uses FTS
candidate_generation:
  fts_limit: 120
  trigram_limit: 80
  semantic_limit: 150
  # pg_trgm similarity floor for the fuzzy arm. This is the live value, asserted
  # equal to the SQL literal in mosaic_search.search_hybrid_rrf by
  # scripts/config_tripwire.py. config/workshop.json recorded 0.24; that value
  # was stale and is not ported.
  trigram_threshold: 0.20
  # Index gates used by pg_trgm's `%` and `<%` operators. They are database
  # defaults rather than function-local SET clauses because a fresh Aurora
  # session has not loaded pg_trgm yet and rejects those clauses at function
  # creation time. scripts/configure_retrieval_database.py applies and verifies
  # these values on the target Aurora database.
  trigram_index_gate:
    similarity_threshold: 0.18
    word_similarity_threshold: 0.5
coverage:
  # Trigram floor separating a misspelling from an absence, for word-shaped
  # tokens only. mosaic_search.query_term_coverage compares the token as
  # written against mosaic_search.corpus_surface_lexeme; a token at or above
  # this floor is `recoverable`, below it `unmatched_anchor`. Identifier-shaped
  # tokens (a model number, a SKU) are never rescued and never consult it.
  #
  # MEASURED on the live 500,000-product cluster on 2026-09-04 against the 12
  # cases in data/evals/coverage_queries.jsonl. Every floor in (0.231, 0.250]
  # classifies all 12 as expected; 0.24 is the value that maximises the smaller
  # margin. Binding on both sides by one token: 'enough' -> 'through' at 0.250
  # must stay rescued, 'zylthorne' -> 'corne' at 0.231 must stay refused.
  #
  # Must stay at or above candidate_generation.trigram_index_gate.
  # similarity_threshold above: the neighbour lookup is gated by the `%`
  # operator, so a floor below that gate would let the index prune candidates
  # the floor would have accepted.
  #
  # Asserted equal to the SQL default in
  # db/sql/20_query_coverage.sql:query_term_coverage by
  # scripts/config_tripwire.py.
  similarity_floor: 0.24
fusion:
  method: reciprocal_rank_fusion
  rrf_k: 60
  # Size of the fused pool handed to the reranker. Reaches
  # RetrievalProfile.fused_limit via RERANK_CANDIDATE_LIMIT.
  #
  # A `rerank.candidate_limit: 30` key sat below this one until Unit C and was
  # read by nothing: the code path uses this value, 50. It was a fourth
  # disagreeing copy inside the file that claimed to be the single source, and
  # it is deleted rather than reconciled.
  fused_limit: 50
  # Per-arm weights, ported BY KEY NAME from config/workshop.json before that
  # file was deleted (Phase 2 Unit C, LOSS-3). Provenance matters: these are the
  # pre-rewrite coefficients, not numbers invented for the comparison that
  # consumes them. Unit D's mosaic_search.search_hybrid_rrf_weighted reads them.
  #
  # NOT consumed by default retrieval. mosaic_search.search_hybrid_rrf stays
  # unweighted: RRF weights by rank position, which is the point of using it.
  # The decision to flip the default to weighted fusion is deliberately
  # scheduled at Unit D's STOP AND REPORT, after the identical-candidate-list
  # assertion proves both functions consume the same pool — so the flip cannot
  # happen by drift.
  #
  # config/workshop.json also carried weights.business_signals: 0.15. It is not
  # ported: the required workshop path is retrievers -> RRF -> reranker, with
  # hard business eligibility expressed as SQL predicates rather than a hidden
  # score adjustment.
  weights:
    lexical: 0.30
    semantic: 0.45
    trigram: 0.10
rerank:
  # Rows shown to a participant after reranking. The pool it selects from is
  # fusion.fused_limit above.
  display_limit: 12
hnsw:
  m: 16
  ef_construction: 200
  ef_search: 100
  iterative_scan: relaxed_order
  max_scan_tuples: 20000
  # Raised from 1 to 2 on 2026-08-17. At 1, mosaic_search.search_vector under a
  # filter anti-correlated with the query neighbourhood returned 42-150 of 150
  # candidates (mean 109.1) across eight retrieval anchors with
  # domain='home_office' — up to 72% of the pool lost silently, then fused by RRF
  # as if complete.
  #
  # The binding limit is `work_mem x scan_mem_multiplier`, which is 4MB on this
  # cluster. max_scan_tuples is NOT the constraint: measured 0 rows at 20K, 100K,
  # 500K and 1M alike on the same query. 2 restores 150/150 and costs +0.1ms
  # unfiltered and on uncorrelated filters, +16ms on the pathological one. 4 and 8
  # measured no better than 2.
  scan_mem_multiplier: 2
media:
  premium_products: 120
  flagships: 6
  retrieval_anchors: 30
  products_per_shop_page: 12
