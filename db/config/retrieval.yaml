# The single source for retrieval numbers.
#
# Read by scripts/checks/retrieval_profile.py, which supplies defaults to
# service/config.py and service/models.py. Environment variables override these
# values; nothing else may declare them. scripts/checks/config_tripwire.py fails the
# build if another file does.
#
# Editing a number here changes the served profile with no code edit. That is
# the point: this file was once documentation, three live copies of these
# numbers agreed by luck, and a fourth (config/workshop.json) disagreed with all
# of them. See docs/rewrite-losses.md LOSS-3.
version: 2
embedding:
  dimensions: 1024
  distance_metric: cosine
  product_field: mosaic_search.product_listing_view.embedding
  evidence_field: product specifications reuse product_listing.embedding; source-specific evidence uses FTS
candidate_generation:
  fts_limit: 120
  fuzzy_limit: 80
  semantic_limit: 150
  # Score floor passed to mosaic_search.search_fuzzy as `minimum_similarity`
  # and asserted equal to the SQL literal in mosaic_search.search_hybrid_rrf by
  # scripts/checks/config_tripwire.py. It is NOT the only gate. search_fuzzy
  # runs two arms: the first (word similarity) admits a row only if
  # `lower(q) <% trigram_text`, which pg_trgm decides at
  # fuzzy_index_gate.word_similarity_threshold below (0.5), so by the time
  # this floor is checked every row already scores at least 0.5 and 0.20 never
  # binds there. The second arm runs only when the first returns no rows; it
  # admits a row on `trigram_text % lower(q)` at
  # fuzzy_index_gate.similarity_threshold (0.18) and then applies this 0.20
  # floor, so 0.20 is binding only on that whole-string fallback.
  # config/workshop.json recorded 0.24; that value was stale and is not ported.
  fuzzy_threshold: 0.20
  # Index gates used by pg_trgm's `%` and `<%` operators. They are database
  # defaults rather than function-local SET clauses because a fresh Aurora
  # session has not loaded pg_trgm yet and rejects those clauses at function
  # creation time. scripts/configure_retrieval_database.py applies and verifies
  # these values on the target Aurora database. similarity_threshold gates `%`
  # (the fallback arm); word_similarity_threshold gates `<%` (the first arm).
  fuzzy_index_gate:
    similarity_threshold: 0.18
    word_similarity_threshold: 0.5
coverage:
  # Fuzzy floor separating a misspelling from an absence, for word-shaped
  # tokens only. mosaic_search.query_term_coverage compares the token as
  # written against mosaic_search.corpus_surface_lexeme; a token at or above
  # this floor is `recoverable`, below it `unmatched_anchor`. Identifier-shaped
  # tokens (a model number, a SKU) are never rescued and never consult it.
  #
  # MEASURED on the live 500,000-product cluster on 2026-09-04 against the 12
  # now-retired synthetic cases. Every floor in (0.231, 0.250]
  # classifies all 12 as expected; 0.24 is the value that maximises the smaller
  # margin. Binding on both sides by one token: 'enough' -> 'through' at 0.250
  # must stay rescued, 'zylthorne' -> 'corne' at 0.231 must stay refused.
  #
  # Must stay at or above candidate_generation.fuzzy_index_gate.
  # similarity_threshold above: the neighbour lookup is gated by the `%`
  # operator, so a floor below that gate would let the index prune candidates
  # the floor would have accepted.
  #
  # Asserted equal to the SQL default in
  # db/sql/11_query_coverage.sql:query_term_coverage by
  # scripts/checks/config_tripwire.py.
  similarity_floor: 0.24
fusion:
  method: reciprocal_rank_fusion
  rrf_k: 60
  # Size of the fused pool handed to the reranker. Reaches
  # RetrievalProfile.fused_limit via RERANK_CANDIDATE_LIMIT.
  #
  # A `rerank.candidate_limit: 30` key once sat below this one and was
  # read by nothing: the code path uses this value, 50. It was a fourth
  # disagreeing copy inside the file that claimed to be the single source, and
  # it is deleted rather than reconciled.
  fused_limit: 50
  # Per-arm weights, ported BY KEY NAME from config/workshop.json before that
  # file was deleted (docs/rewrite-losses.md LOSS-3). Provenance matters: these
  # are the pre-rewrite coefficients, not numbers invented for the comparison
  # that consumes them. mosaic_search.search_hybrid_rrf_weighted reads them.
  #
  # NOT consumed by default retrieval. mosaic_search.search_hybrid_rrf stays
  # unweighted: RRF weights by rank position, which is the point of using it.
  # Making weighted fusion the default is a deliberate decision, taken only with
  # the identical-candidate-list assertion proving both functions consume the
  # same pool, so the default cannot flip by drift.
  #
  # config/workshop.json also carried weights.business_signals: 0.15. It is not
  # ported: the required workshop path is retrievers -> RRF -> reranker, with
  # hard business eligibility expressed as SQL predicates rather than a hidden
  # score adjustment.
  weights:
    fts: 0.30
    semantic: 0.45
    fuzzy: 0.10
rerank:
  # Rows shown to a participant after reranking. The pool it selects from is
  # fusion.fused_limit above.
  display_limit: 12
hnsw:
  m: 16
  ef_construction: 200
  ef_search: 100
  iterative_scan: relaxed_order
  max_scan_tuples: 20000
  # Raised from 1 to 2 on 2026-08-17. At 1, mosaic_search.search_semantic under a
  # filter anti-correlated with the query neighbourhood returned 42-150 of 150
  # candidates (mean 109.1) across eight retrieval anchors with
  # domain='home_office' — up to 72% of the pool lost silently, then fused by RRF
  # as if complete.
  #
  # On that retired synthetic catalog the binding limit was `work_mem x
  # scan_mem_multiplier` (4MB): max_scan_tuples measured 0 rows at 20K to 1M
  # alike, and 4 and 8 measured no better than 2.
  #
  # On the served reviews-2023-v2 catalog (553,911 rows) PostgreSQL chooses the
  # plan per request. Measured on a fresh event on 2026-10-22: under Lab 1's
  # headphones filter (42,538 eligible) search_semantic scans
  # product_search_vector_idx and then applies the filter, returning 118 of the
  # exact 150 for "headphones that help me focus when working from home". Under
  # Lab 2's monitors filter (6,830 eligible) it reads product_search_kind_idx and
  # sorts every match by exact distance, so these four settings do not affect that
  # request. In the 2026-11-09 benchmark (docs/current-scale-benchmarks.md, 73
  # anchors, top 10) max_scan_tuples, not scan memory, was the main limit for
  # narrow filters: doubling scan memory moved the three narrowest presets by 0.3
  # to 0.6 rows. The optional Scale & HNSW exercise measures recall live with
  # scripts/lab_exercise.py grade --lab 1. Figures from the retired
  # reviews-2023-500k-v1 catalog are in docs/abstract-delivery-map.md.
  scan_mem_multiplier: 2
media:
  premium_products: 120
  flagships: 6
  retrieval_anchors: 30
  products_per_shop_page: 12
