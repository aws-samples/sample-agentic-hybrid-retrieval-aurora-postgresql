<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="520" viewBox="0 0 1188 520" role="img" aria-labelledby="title desc">
  <title id="title">Verity request and evidence flow</title>
  <desc id="desc">Operational records from Slack, Jira, Confluence, Salesforce, and GitHub are materialized in Aurora PostgreSQL, retrieved by five signals, fused, reranked, exposed through the search_evidence and answer_with_citations AgentCore tools, synthesized by Strands, and persisted in four named Aurora tables as auditable evidence.</desc>
