name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        id: python-deps
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen

      # Every gate below is its own step guarded by !cancelled(), so one red
      # gate reports itself without hiding the others. They used to share a
      # single run block, where bash -e let the first failure skip the rest.
      # The guards additionally require the install a gate depends on, so a
      # broken environment surfaces once instead of as twelve failures.

      - name: Check lint and formatting
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: make lint

      - name: Validate the retrieval package
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: make validate

      - name: Validate the database contracts
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: make validate-db

      - name: Validate the retrieval configuration
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: make validate-config

      - name: Validate the lab contract
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: uv run python scripts/mission_contract.py

      - name: Run the Python test suite
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: PYTHONPATH=. uv run pytest -q

      - name: Install the MCP adapter
        id: mcp-deps
        if: ${{ !cancelled() && steps.python-deps.outcome == 'success' }}
        run: make mcp-install

      - name: Test the MCP adapter
        if: ${{ !cancelled() && steps.mcp-deps.outcome == 'success' }}
        run: make mcp-test

      - name: Install UI dependencies
        id: ui-deps
        if: ${{ !cancelled() }}
        run: make ui-install

      - name: Test the UI
        if: ${{ !cancelled() && steps.ui-deps.outcome == 'success' }}
        run: make ui-test

      - name: Build the UI
        if: ${{ !cancelled() && steps.ui-deps.outcome == 'success' }}
        run: make ui-build

      - name: Audit UI dependencies
        if: ${{ !cancelled() && steps.ui-deps.outcome == 'success' }}
        run: make ui-audit

  aurora-release:
    name: Aurora release contracts
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
      - mosaic-aurora
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AURORA_INSTANCE_CLASS: db.r8g.2xlarge
      AWS_CI_ROLE_ARN: ${{ secrets.MOSAIC_AURORA_CI_ROLE_ARN }}
      DATABASE_URL: ${{ secrets.MOSAIC_AURORA_DATABASE_URL }}
      # mission_contract.py and function_census.py both skip their Aurora
      # checks when these are unset. They are job-level rather than step-level
      # so splitting the gates apart cannot silently drop one and let the
      # corresponding gate pass without ever reaching the cluster.
      MISSION_GATE_REQUIRE_DB: '1'
      FUNCTION_CENSUS_REQUIRE_DB: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen

      - name: Require the Aurora release environment
        run: |
          test -n "$DATABASE_URL" || {
            echo "MOSAIC_AURORA_DATABASE_URL is required for Aurora release CI."
            exit 2
          }
          test -n "$AWS_CI_ROLE_ARN" || {
            echo "MOSAIC_AURORA_CI_ROLE_ARN is required for Bedrock release CI."
            exit 2
          }

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}

      # Every step above is a precondition and stays fail-fast, so each one only
      # runs when the previous succeeded. That makes the credential step's own
      # success a proxy for the whole chain: guarding on it is enough for the
      # gates below, and a broken environment reports once instead of six times.

      # These five gates are read-only and independent of one another, so they
      # each report rather than letting the first failure hide the rest.

      - name: Validate the lab contract against Aurora
        if: ${{ !cancelled() && steps.aws-credentials.outcome == 'success' }}
        run: make validate-missions

      - name: Validate the eval filter contracts
        if: ${{ !cancelled() && steps.aws-credentials.outcome == 'success' }}
        run: make validate-evals

      - name: Take the function census
        if: ${{ !cancelled() && steps.aws-credentials.outcome == 'success' }}
        run: make validate-functions

      - name: Verify the bootstrap acceptance state
        if: ${{ !cancelled() && steps.aws-credentials.outcome == 'success' }}
        run: make db-verify-bootstrap

      - name: Run the Python test suite against Aurora
        if: ${{ !cancelled() && steps.aws-credentials.outcome == 'success' }}
        run: make test

      # Deliberately left unguarded, so the implicit success() applies and this
      # runs only when every step above passed. score-evals spends Bedrock
      # embedding and reranking calls and then judges provenance and metric
      # regressions, and `make validate-evals` exists to check the filter corpus
      # on Aurora before an eval is allowed to spend model calls. Guarding this
      # like the gates above would let it bill a run and report regressions that
      # only reflect an unverified cluster.
      - name: Score the release evals
        run: make score-evals
