[project]
name = "mosaic-agentic-hybrid-retrieval"
version = "0.2.0"
description = "DAT410 Mosaic hybrid retrieval workshop on Aurora PostgreSQL"
requires-python = "==3.13.*"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "opentelemetry-api>=1.44,<2",
    "pgvector>=0.3,<1",
    "pillow>=11,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.8,<3",
    "strands-agents==1.48.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
agentcore-observability = [
    "aws-opentelemetry-distro>=0.18,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.0.3,<10",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
# `db/tests` is listed because it was collected by nothing for as long as it has
# existed: no Makefile target and no CI step named it, and `testpaths = ["tests"]`
# excluded it from a plain `pytest` run, so its ten static SQL assertions never
# executed anywhere. Adding a directory here is the whole fix; they pass.
testpaths = ["tests", "db/tests"]
markers = [
    "aurora: requires the live Aurora cluster and Bedrock model access",
]

[tool.ruff]
target-version = "py313"
